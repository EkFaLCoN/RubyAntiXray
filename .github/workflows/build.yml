name: Build RubyAntiXray

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Kodu al
        uses: actions/checkout@v4

      - name: Zip'i ac
        run: unzip -o RubyAntiXray.zip -d _src

      - name: Java 21 kur
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Derle
        working-directory: _src/RubyAntiXray
        run: mvn -B clean package

      - name: Jar'i yukle
        uses: actions/upload-artifact@v4
        with:
          name: RubyAntiXray-jar
          path: _src/RubyAntiXray/target/*.jar
          if-no-files-found: error
